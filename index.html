<html lang="en">
<head>

  <title>Sai Deekshith Peddy | AI & ML Student</title>

  <!-- React 18, Babel and Tailwind CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    .page-bg {
      background:
        radial-gradient(circle at 15% 15%, rgba(56,189,248,.25), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(168,85,247,.28), transparent 35%),
        linear-gradient(135deg, #eef2ff 0%, #fdf2f8 48%, #fff7ed 100%);
    }
    .page-bg.dark {
      background:
        radial-gradient(circle at 15% 15%, rgba(14,165,233,.16), transparent 32%),
        radial-gradient(circle at 85% 85%, rgba(139,92,246,.20), transparent 35%),
        #080d19;
    }
    .glass {
      background: rgba(255,255,255,.64);
      border: 1px solid rgba(255,255,255,.78);
      box-shadow: 0 24px 80px rgba(31,41,55,.14);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }
    .glass-dark {
      background: rgba(17,24,39,.76);
      border: 1px solid rgba(255,255,255,.10);
      box-shadow: 0 24px 80px rgba(0,0,0,.38);
      backdrop-filter: blur(22px);
      -webkit-backdrop-filter: blur(22px);
    }
    .avatar-ring {
      background: linear-gradient(135deg, #38bdf8, #8b5cf6, #ec4899);
      padding: 4px;
    }
    .skill-chip { transition: transform .2s ease, background .2s ease; }
    .skill-chip:hover { transform: translateY(-3px); }
    .action-btn { transition: transform .2s ease, box-shadow .2s ease; }
    .action-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(15,23,42,.16); }
    .social-link { transition: transform .2s ease, background .2s ease; }
    .social-link:hover { transform: translateY(-3px); }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // Reusable profile card. Props are the information passed into this component.
    function ProfileCard({ name, role, bio, skills, avatar, github, twitter, linkedin }) {
      // State: values that change when a user interacts with the card.
      const [isDark, setIsDark] = useState(false);
      const [isConnected, setIsConnected] = useState(false);
      const [liked, setLiked] = useState(false);
      const [likeCount, setLikeCount] = useState(0);

      const toggleLike = () => {
        setLiked(previous => !previous);
        setLikeCount(count => count + (liked ? -1 : 1));
      };

      const textMain = isDark ? "text-white" : "text-slate-900";
      const textMuted = isDark ? "text-slate-300" : "text-slate-600";
      const chipStyle = isDark
        ? "bg-white/10 text-slate-100 border-white/10"
        : "bg-white/70 text-slate-800 border-white/80";

      return (
        <main className={`page-bg ${isDark ? "dark" : ""} min-h-screen w-full flex items-center justify-center px-4 py-12 transition-colors duration-500`}>
          <button
            type="button"
            onClick={() => setIsDark(value => !value)}
            aria-label={isDark ? "Switch to light mode" : "Switch to dark mode"}
            title={isDark ? "Switch to Light Mode" : "Switch to Dark Mode"}
            className="fixed right-5 top-5 z-10 grid h-12 w-12 place-items-center rounded-full glass text-xl hover:scale-110 transition-transform"
          >
            {isDark ? "☀️" : "🌙"}
          </button>

          <section className={`${isDark ? "glass-dark" : "glass"} w-full max-w-md rounded-[2rem] p-7 sm:p-9`}>
            <div className="mb-6 flex justify-center">
              <div className="avatar-ring h-36 w-36 rounded-full shadow-xl">
                <img
                  src={avatar}
                  alt={`${name} profile avatar`}
                  className="h-full w-full rounded-full border-4 border-white/70 object-cover"
                />
              </div>
            </div>

            <div className="mb-5 text-center">
              <p className={`mb-2 text-xs font-bold uppercase tracking-[.25em] ${isDark ? "text-sky-300" : "text-indigo-600"}`}>
                Hello, I'm
              </p>
              <h1 className={`mb-2 text-3xl font-extrabold tracking-tight sm:text-4xl ${textMain}`}>
                {name}
              </h1>
              <p className={`text-base font-semibold sm:text-lg ${textMuted}`}>{role}</p>
            </div>

            <p className={`mb-6 text-center text-sm leading-7 sm:text-base ${textMuted}`}>
              {bio}
            </p>

            <div className="mb-7">
              <p className={`mb-3 text-center text-xs font-bold uppercase tracking-[.2em] ${textMuted}`}>
                Skills & Interests

              <div className="flex flex-wrap justify-center gap-2">
                {skills.map((skill, index) => (
                  <span
                    key={`${skill}-${index}`}
                    className={`skill-chip rounded-full border px-4 py-2 text-xs font-semibold sm:text-sm ${chipStyle}`}
                  >
                    {skill}
                  </span>
                ))}
              </div>
            </div>

              <button
                type="button"
                onClick={() => setIsConnected(value => !value)}
                className={`action-btn rounded-xl px-4 py-3 text-sm font-bold ${
                  isConnected
                    ? "bg-emerald-500 text-white"
                    : isDark
                      ? "bg-white text-slate-900"
                      : "bg-slate-900 text-white"

              >
                {isConnected ? "✓ Connected" : "Connect"}
              </button>

                type="button"
                onClick={toggleLike}
                aria-pressed={liked}

                  liked
                    ? "border-rose-400 bg-rose-500 text-white"
                    : isDark
                      ? "border-white/15 bg-white/10 text-white"
                      : "border-slate-200 bg-white/70 text-slate-800"
                }`}
              >
                {liked ? "♥ Liked" : "♡ Like"} · {likeCount}
              </button>
            </div>

            <div className="flex items-center justify-center gap-3">
              {github && (
                <a className={`social-link rounded-full p-3 ${isDark ? "bg-white/10 text-white" : "bg-white/75 text-slate-800"}`}
                   href={github} target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                  <svg viewBox="0 0 24 24" className="h-5 w-5" fill="currentColor" aria-hidden="true">
                    <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                  </svg>
                </a>
              )}
              {linkedin && (
                <a className={`social-link rounded-full p-3 ${isDark ? "bg-white/10 text-white" : "bg-white/75 text-slate-800"}`}
                   href={linkedin} target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                  <svg viewBox="0 0 24 24" className="h-5 w-5" fill="currentColor" aria-hidden="true">

                  </svg>
                </a>
              )}
              {twitter && (
                <a className={`social-link rounded-full p-3 ${isDark ? "bg-white/10 text-white" : "bg-white/75 text-slate-800"}`}
                   href={twitter} target="_blank" rel="noopener noreferrer" aria-label="Twitter / X">
                  <svg viewBox="0 0 24 24" className="h-5 w-5" fill="currentColor" aria-hidden="true">
                    <path d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.6 22H2.5l7.3-8.4L1.8 2h6.5l4.4 6.8L18.9 2zm-1.1 18h1.7L7.3 3.9H5.5L17.8 20z"/>
                  </svg>
                </a>
              )}
            </div>

            <div className={`mt-7 border-t pt-5 text-center ${isDark ? "border-white/10" : "border-slate-200/80"}`}>
              <p className={`text-xs ${textMuted}`}>Built with React 18 + Tailwind CSS</p>
              <p className={`mt-1 text-[11px] ${textMuted}`}>ApnoAI · Task 2 — Build a React Component</p>
            </div>
          </section>
        </main>
      );
    }
